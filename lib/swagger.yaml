openapi: 3.0.0
info:
  title: aloux-sdk
  description: APIs para Aloux SDK
  version: 1.0.0
  contact:
    name: API Aloux
    url: https://aloux.mx
    email: correo@example
components:
  securitySchemes:
    bearerAuth:            # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /iam/auth/email:
    post:
      summary: Validar que el correo exista
      tags:
        - users - self
      description: Validar que el correo exista
      requestBody:
        content:
          'application/json':
            schema:
              properties:
                  email: 
                    description: email
                    type: string
                    example: correo@example
                  code:
                    description: code
                    type: string
                    example: true
              required:
                - email
      responses:
        '200':    # status code
          description: Ok
          content:
            application/json:
              schema:
                type: object
                items:
                  type:  string
  /iam/auth/login:
    post:
      summary: Iniciar sesión
      tags:
        - users - self
      description: Iniciar sesión
      requestBody:
        content:
          'application/json':
            schema:
              properties:
                  email: 
                    description: email
                    type: string
                    example: correo@example
                  pwd:
                    description: password
                    type: string
                    example: password
              required:
                - email
                - pwd
      responses:
        '200':    # status code
          description: Return token
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/verify/mail: 
    post: 
      tags: 
        - users - self 
      summary: Enviar correo para verificar correo de la cuenta
      description: Enviar correo para verificar correo de la cuenta 
      requestBody: 
        content: 
          'application/json':
            schema: 
              properties:
                email: 
                  description: email 
                  type: string 
                  example: correo@example
              required: 
                - email
      responses: 
        '200': 
          description: ok 
          content: 
            application/json:
              schema: 
                type: object
                items: 
                  type: string 
  /iam/auth/verify/mail/token/{token}:
    get:
      parameters:
        - name: token 
          in: path 
          description: token de verificación de cuenta 
          required: true 
          schema: 
            type: string 
      summary: Valida correo de la cuenta (Manda coreo de bienvenida)
      tags:
        - users - self
      description: Valida correo de la cuenta (Manda coreo de bienvenida)
      responses:
        '200':    # status code
          description: Return token
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/forgot/password:
    post:
      summary: Enviar código a correo
      tags:
        - users - self
      description: Enviar código a correo
      requestBody:
        content:
          'application/json':
            schema:
              properties:
                  email: 
                    description: email
                    type: string
                    example: correo@example
              required:
                - email
      responses:
        '200':    # status code
          description: Ok
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/signup:
    post:
      summary: Registrarse
      tags:
        - users - self
      description: Crea una cuenta
      requestBody:
        content:
          'application/json':
            schema:
              properties:
                  name:
                    description: Name
                    type: string
                    example: Arturo
                  lastName:
                    description: Last name
                    type: string
                    example: Vázquez
                  phone:
                    description: Phone
                    type: string
                    example: 1234567891011
                    maxLength: 13
                  email: 
                    description: email
                    type: string
                    example: correo@example
                  pwd:
                    description: password
                    type: string
                    example: password
                    minLength: 8
                  data:
                    type: object
                    properties:
                      age:
                        description: Age
                        type: integer
                        example: 26
                      gender:
                        description: Gender
                        type: string
                        enum: ["male","female"]
                      scholarship:
                        description: Scholarship
                        type: string
                        example: university
                      Entity:
                        description: Entity
                        type: string
                        example: Puebla
              required:
                - name
                - lastName
                - phone
                - email
                - pwd
                - data
      responses:
        '200':    # status code
          description: Ok
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/validate/code:
    post:
      summary: Verificar código
      tags:
        - users - self
      description: Verificar código
      requestBody:
        content:
          'application/json':
            schema:
              properties:
                  email: 
                    description: email
                    type: string
                    example: correo@example
                  resetCode:
                    description: código de verificación
                    type: number 
                    example: 2137
              required:
                - email
      responses:
        '200':    # status code
          description: ok
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/reset/password:
    post:
      summary: 	Reestablecer contraseña
      tags:
        - users - self
      description: 	Reestablecer contraseña
      requestBody:
        content:
          'application/json':
            schema:
              properties:
                  email: 
                    description: email
                    type: string
                    example: correo@example
                  pwd: 
                    description: contraseña nueva 
                    type: string 
                    example: "password"
                  resetCode: 
                    description: código de verificación 
                    type: string 
                    example: 2137
              required:
                - email 
                - pwd 
                - resetCode
      responses:
        '200':    # status code
          description: Return token
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/me:
    get:
      summary: Obtener información de usuario autenticado
      tags:
        - users - self
      description: Obtener información de usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: A JSON object of a client
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/profile:
    put:
      summary: Actualizar perfil
      tags:
        - users - self
      description: Actualizar perfil
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
                  properties:
                      name: 
                        type: string
                        example: Martín
                      lastName: 
                        type: string
                        example: Martínez
                      email: 
                        description: email
                        type: string
                        example: correo@example
                      pwd:
                        description: password
                        type: string
                        example: password
                      phone:
                        type: string
                        example: +525567087001
                      _functions:
                        type: array
                        items:
                          type: string
                          format: ObjectId
                          example: "61b06de713a90b4d6dce7224"
                      _client:
                        type: array
                        items:
                          type: string
                          format: ObjectId
                          example: "64371ab1b6dc1417c9c0b812"
                  required:
                    - email
                    - pwd
      responses:
        '202':    # status code
          description: A JSON object of a client
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/profile/pictura:
    put:
      summary: 	Actualizar solo la foto de perfil
      tags:
        - users - self
      description: 	Actualizar solo la foto de perfil
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                urlImg:
                  description: Variable en donde se carga la imagen seleccionada del usuario
                  type: string
                  format: binary
      responses:
        '202':    # status code
          description: Retorna el estado de actualización de la imagen de perfil del usuario
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/send/verify/phone:
    post:
      summary: 	Enviar código al teléfono de la cuenta para verificarla
      tags:
        - users - self
      description: 	Enviar código al teléfono de la cuenta para verificarla
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                phone:
                  description: Teléfono de la cuenta del usuario
                  type: string
                  example: "+522491609423"
      responses:
        '200':    # status code
          description: ok
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/verify/phone:
    post:
      summary: Valida teléfono del usuario de la cuenta
      tags:
        - users - self
      description: 	Valida teléfono del usuario de la cuenta
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                codeVerifyPhone:
                  description: Código de verificación
                  type: number
                  example: 2137
      responses:
        '200':    # status code
          description: ok
          content:
            application/json:
              schema: 
                type: object
                items: 
                  type: string
  /iam/auth/logout:
    post:
      summary: Cerrar sesión
      tags:
        - users - self
      description: Cierra la sesión de mi usuario
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Ok
          content:
            application/json:
              schema:
                type: object
                items:
                  type: string
  /iam/auth/logout-all:
    post:
      summary: Cerrar todas las sesiones
      tags:
        - users - self
      description: Cierra todas las sesiones activas de mi usuario, incluyendo la actual
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Ok
          content:
            application/json:
              schema:
                type: object
                items:
                  type: string
  /iam/auth/sessions:
    get:
      summary: Listar sesiones activas
      tags:
        - users - self
      description: Lista las sesiones activas de mi usuario, marcando cuál es la actual
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Arreglo de sesiones
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      format: ObjectId
                      example: "64371ab1b6dc1417c9c0b812"
                    date:
                      description: Fecha de inicio de la sesión (epoch ms)
                      type: number
                      example: 1732300000000
                    dateEnd:
                      description: Fecha de expiración de la sesión (epoch ms)
                      type: number
                      example: 1732900000000
                    expired:
                      type: boolean
                      example: false
                    current:
                      description: true si es la sesión desde la que se hace la petición
                      type: boolean
                      example: true
  /iam/auth/sessions/{id}:
    delete:
      summary: Cerrar una sesión específica
      tags:
        - users - self
      description: Cierra una sesión de mi usuario por su id (puede ser la actual o cualquier otra)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: ObjectId
      responses:
        '200':    # status code
          description: Ok
          content:
            application/json:
              schema:
                type: object
                items:
                  type: string
  /iam/user:
    post:
      summary: Crear un usuario
      tags:
        - users
      description: Crea un nuevo usuario
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
                  properties:
                      name: 
                        type: string
                        example: Martín
                      lastName: 
                        type: string
                        example: Martínez
                      email: 
                        description: email
                        type: string
                        example: correo@example
                      pwd:
                        description: password
                        type: string
                        example: password
                      phone:
                        type: string
                        example: +525567087001
                      _functions:
                        type: array
                        items:
                          type: string
                          format: ObjectId
                          example: "61b06de713a90b4d6dce7224"
                      _client:
                        type: array
                        items:
                          type: string
                          format: ObjectId
                          example: "64371ab1b6dc1417c9c0b812"
                  required:
                    - email
                    - pwd
      responses:
        '200':    # status code
          description: Ok
    get:
      summary: 	Obtener todos los usuario
      tags:
        - users
      description:	Obtener todos los usuario
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Retorna una lista de objetos de los usuarios registrados
  /iam/user/{USER_ID}:
    get:
      parameters:
      - name: USER_ID
        in: path
        description: Obtener detalle de usuario
        required: true
        schema:
          type: string
          format: ObjectId
      summary: Obtener detalle de usuario
      tags:
        - users
      description: Obtener detalle de usuario
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Retorna un objeto JSON de un usuario
    patch:
      parameters:
      - name: USER_ID
        in: path
        description: ID de un usuario que este registrado
        required: true
        schema:
          type: string
          format: ObjectId
      summary: 	Actualizar usuario
      tags:
        - users
      description: Actualizar usuario
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
                  properties:
                      name: 
                        type: string
                        example: Martín
                      lastName: 
                        type: string
                        example: Martínez
                      phone:
                        type: string
                        example: +525567087001
                      email: 
                        description: email
                        type: string
                        example: correo@example
                      pwd:
                        description: password
                        type: string
                        example: password
                  required:
                    - email
                    - pwd
      responses:
        '200':    # status code
          description: Retorna un objeto JSON de un usuario
    delete:
      parameters:
      - name: USER_ID
        in: path
        description: ID de un usuario que este registrado
        required: true
        schema:
          type: string
          format: ObjectId
      summary: Eliminar usuario
      tags:
        - users
      description: Eliminar usuario
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Ok
  /iam/user/{USER_ID}/status:
    put:
      parameters:
      - name: USER_ID
        in: path
        description: ID de un usuario que este registrado
        required: true
        schema:
          type: string
          format: ObjectId
      summary: 	Activar o desactivar usuario
      tags:
        - users
      description: Activar o desactivar usuario
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
                  properties:
                      status: 
                        type: string
                        example: Activo
      responses:
        '200':    # status code
          description: Retorna result from response
  /iam/user/password/{USER_ID}:
    put:
      parameters:
      - name: USER_ID
        in: path
        description: ID de un usuario que este registrado
        required: true
        schema:
          type: string
          format: ObjectId
      summary: Actualizar la constraseña de un usuario
      tags:
        - users
      description: Actualizar la constraseña de un usuario
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
                  properties:
                      pwd: 
                        type: string
                        example: password
      responses:
        '200':    # status code
          description: Retorna result from response
  /iam/user/count/all:
    get:
      summary: Obtiene el número de usuarios
      tags:
        - users
      description: Obtiene el número de usuarios
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Retorna el resultado de la respuesta
  /iam/user/pages:
    post:
      summary: Listar usuarios (Paginado)
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        description: Configuración de paginación
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  properties:
                    page:
                      type: integer
                      default: 1
                    itemsPerPage:
                      type: integer
                      default: 10
                filter:
                  type: object
              example:
                config:
                  page: 1
                  itemsPerPage: 10
      responses:
        '200':
          description: ok
  /iam/functions:
    post:
      summary: Crea una función
      tags:
        - functions
      description: Crea una función
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
                  properties:
                      name: 
                        type: string
                        example: Propietario
                      description: 
                        type: string
                        example: Acceso a todas las funcionalidades de la plataforma
                      _permissions:
                        type: string
                        format: ObjectId
                        example: "61b06de713a90b4d6dce5141"
                  required:
                    - name
      responses:
        '201':    # status code
          description: ok
    get:
      summary: 	Obtener todas las funciones
      tags:
        - functions
      description: 	Obtener todas las funciones
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Retorna el resultado de la respuesta
  /iam/functions/{FUNCTION_ID}:
    get:
      parameters:
      - name: FUNCTION_ID
        in: path
        description: ID de un funcion que este registrada
        required: true
        schema:
          type: string
          format: ObjectId
      summary: 	Obtener detalle de la función
      tags:
        - functions
      description: 	Obtener detalle de la función
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Retorna el resultado de la respuesta
    patch:
      parameters:
      - name: FUNCTION_ID
        in: path
        description: ID de una función que este registrada
        required: true
        schema:
          type: string
          format: ObjectId
      summary: 	Actualizar función
      tags:
        - functions
      description: 	Actualizar función
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
                  properties:
                      name: 
                        type: string
                        example: Propietario
                      description: 
                        type: string
                        example: Acceso a todas las funcionalidades de la plataforma
                      _permissions:
                        type: string
                        format: ObjectId
                        example: "61b06de713a90b4d6dce5141"
                  required:
                    - name
      responses:
        '200':    # status code
          description: Retorna un objeto JSON de una función
    delete:
      parameters:
      - name: FUNCTION_ID
        in: path
        description: ID de una función que este registrado
        required: true
        schema:
          type: string
          format: ObjectId
      summary: 	Eliminar función
      tags:
        - functions
      description: 	Eliminar función
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Ok
  /iam/functions/{FUNCTION_ID}/status:
    put:
      parameters:
      - name: FUNCTION_ID
        in: path
        description: ID de una función que este registrada
        required: true
        schema:
          type: string
          format: ObjectId
      summary: 	Activar o desactivar función
      tags:
        - functions
      description: 	Activar o desactivar función
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
                  properties:
                      status: 
                        type: string
                        example: Activo
      responses:
        '200':    # status code
          description: Retorna el resultado de la respuesta
  /iam/functions/count/all:
    get:
      summary: 	Obtiene el número de funciones
      tags:
        - functions
      description: 	Obtiene el número de funciones
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Retorna el resultado de la respuesta
  /iam/functions/pages:
    post:
      summary: Listar funciones (Paginado)
      tags:
        - functions
      security:
        - bearerAuth: []
      requestBody:
        description: Configuración de paginación
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  properties:
                    page:
                      type: integer
                      default: 1
                    itemsPerPage:
                      type: integer
                      default: 10
                filter:
                  type: object
              example:
                config:
                  page: 1
                  itemsPerPage: 10
      responses:
        '200':
          description: ok
  /iam/permission:
    post:
      summary: Crea un permiso
      tags:
        - permissions
      description: Crea un permiso
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
                  properties:
                      description: 
                        description: Describe la funcionalidad del permiso
                        type: string
                      method: 
                        description: Tipo de HTTP REQUEST del permiso
                        type: string
                        example: GET
                      api:
                        description: ruta que accede a la función que utilice el permiso
                        type: string
                        example: "api.create"
                      endpoint:
                        description: path del permiso 
                        type: string
                        example: "/api/permissions"
                      auth:
                        description: Identifica si para acceder al permiso necesita un token o es público
                        type: number
                        example: 1
                      _menu:
                        description: hace referencia a si el permiso pertenece a un menú en especifíco
                        type: string
                        format: ObjectId
                        example: "61b06de713a90b4d6dce7171"
                  required:
                    - description 
                    - method 
                    - api 
                    - endpoint 
                    - _menu
      responses:
        '201':    # status code
          description: retorna el resultado de la respuesta
    get:
      summary: 	Obtener todos los permisos
      tags:
        - permissions
      description: 	Obtener todos los permisos
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Retorna una lista de objetos JSON
  /iam/permission/{PERMISSION_ID}:
    get:
      parameters:
      - name: PERMISSION_ID
        in: path
        description: ID de un permiso que este registrado
        required: true
        schema:
          type: string
          format: ObjectId
      summary: Obtener detalle del permiso
      tags:
        - permissions
      description: Obtener detalle del permiso
      security:
        - bearerAuth: []
      responses:
        '200':    # status code
          description: Retorna un objeto JSON
    patch:
      parameters:
      - name: PERMISSION_ID
        in: path
        description: ID de un permiso que este registrado
        required: true
        schema:
          type: string
          format: ObjectId
      summary: Actualizar permiso
      tags:
        - permissions
      description: Actualizar permiso
      security:
        - bearerAuth: []
      requestBody:
        content:
          'application/json':
            schema:
                  properties:
                      description: 
                        description: Describe la funcionalidad del permiso
                        type: string
                      method: 
                        description: Tipo de HTTP REQUEST del permiso
                        type: string
                        example: GET
                      api:
                        description: ruta que accede a la función que utilice el permiso
                        type: string
                        example: "api.create"
                      endpoint:
                        description: path del permiso 
                        type: string
                        example: "/api/permissions"
                      auth:
                        description: Identifica si para acceder al permiso necesita un token o es público
                        type: number
                        example: 1
                      _menu:
                        description: hace referencia a si el permiso pertenece a un menú en especifíco
                        type: string
                        format: ObjectId
                        example: "61b06de713a90b4d6dce7171"
      responses:
        '200':    # status code
          description: Retorna un objeto JSON de un permiso
    delete:
      parameters:
      - name: PERMISSION_ID
        in: path
        description: ID de un permiso que este registrado
        required: true
        schema:
          type: string
          format: ObjectId
      summary: 	Eliminar permiso
      tags:
        - permissions
      description: 	Eliminar permiso
      security:
